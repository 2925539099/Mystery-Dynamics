plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = '神秘动力学'
}

// 下载源镜像（Mojang / NeoForge 官方源在本机不可达）
apply from: 'gradle/mojang-mirror.gradle'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// 第三方前置只作为编译期依赖：运行时由整合包提供，不随本模组发布。
// 依赖目录默认 libs/，可以用 -PdepsDir=<路径> 指到项目外，避免前置 jar 混进工程。
def depsDir = file(project.findProperty('depsDir') ?: '../.tools/deps')
if (!depsDir.exists()) {
    depsDir = file('libs')
}
dependencies {
    compileOnly files(
            "${depsDir}/create-6.0.10.jar",
            "${depsDir}/ponder-neoforge-1.0.82+mc1.21.1.jar",
            "${depsDir}/flywheel-neoforge-1.21.1-1.0.6.jar",
            "${depsDir}/Registrate-MC1.21-1.3.0+67.jar",
            "${depsDir}/thaumcraft-0.2.2.95-port.265.jar"
    )
}

// 源码包不是模组，剔除元数据并单独输出（同盔甲附加的处理）
tasks.named('sourcesJar', Jar) {
    exclude 'META-INF/neoforge.mods.toml'
    destinationDirectory.set(layout.buildDirectory.dir('libs/sources'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "mystery_dynamics" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': 'mystery_dynamics.mixins.json'
    }
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}
